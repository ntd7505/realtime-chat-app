spring:
  application:
    name: chat-app-server

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  devtools:
    restart:
      enabled: false

app:
  jwt:
    access-token-expiration: 900 # 15 phút

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  refresh-token:
    expiration: 2592000 # 30 ngày
    cookie:
      name: refresh_token
      path: /auth
      http-only: true
      same-site: strict
      secure: true
