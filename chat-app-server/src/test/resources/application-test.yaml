spring:
  datasource:
    url: jdbc:h2:mem:chat-app-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

app:
  jwt:
    secret: dGVzdC1qd3Qtc2VjcmV0LWtleS10aGF0LWlzLWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmc=
    access-token-expiration: 900

  refresh-token:
    expiration: 2592000
    cookie:
      name: refresh_token
      path: /auth
      http-only: true
      same-site: strict
      secure: false
